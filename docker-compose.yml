services:
  tbc-whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbc-whatsapp-bot
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - tbc-bot-data:/usr/src/app/data
    env_file:
      - .env
    environment:
      - PORT=3001
    networks:
      - tbc-bot-network

networks:
  tbc-bot-network:
    driver: bridge

volumes:
  tbc-bot-data:
    driver: local